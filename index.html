<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which AI Found It?</title>
<meta name="description" content="Two AI models diagnosed the same outages on a Raspberry Pi cluster. Pick the better diagnosis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
/* Layout: an incident console. One column on phones; the two diagnoses sit side by side from 900px. */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --ink: #17202a; --muted: #5b6672; --line: #d8dcd6;
  --signal: #c2410c;          /* incident orange: the symptom, the call to act */
  --a: #1f5f8b; --a-soft: #e6eef5;   /* diagnosis A */
  --b: #6b4f9e; --b-soft: #eeeaf5;   /* diagnosis B */
  --anthropic: #b4542e; --openai: #2d6a4f;
  --code: #eef0ec;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161b; --surface: #1b2128; --ink: #e8ebe6; --muted: #9aa5b0; --line: #2d353e;
    --signal: #f08a4b; --a: #7fb4dc; --a-soft: #1c2b38; --b: #b9a2e3; --b-soft: #2a2438;
    --anthropic: #e08b66; --openai: #6fbf98; --code: #252c34;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
main { max-width: 72rem; margin: 0 auto; }
h1, h2 { font-family: var(--font-display); line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: -.01em; }
h2 { font-size: clamp(1.4rem, 4.5vw, 2rem); }
p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 1rem; }
.eyebrow { font: 600 .75rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.lede { font-size: 1.1rem; max-width: 40rem; color: var(--ink); }
.muted { color: var(--muted); }
button, .btn { font: 600 1rem/1 var(--font-body); border: 0; border-radius: 6px; padding: .95rem 1.4rem; cursor: pointer;
  background: var(--ink); color: var(--bg); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
button.secondary, .btn.secondary { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }

/* Intro */
.intro { padding-block: 2rem 1rem; max-width: 46rem; }
.pi { font-family: var(--font-mono); font-size: .85rem; color: var(--muted); border-left: 3px solid var(--signal); padding-left: .8rem; }

/* Round */
.progress { display: flex; gap: .35rem; }
.progress span { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
.progress span.done { background: var(--ink); }
.progress span.now { background: var(--signal); }
.symptom { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--signal); border-radius: 6px; padding: .9rem 1rem; }
.symptom strong { font-family: var(--font-mono); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--signal); display: block; margin-bottom: .25rem; }
.pair { display: grid; grid-template-columns: 1fr; gap: 1rem; }
@media (min-width: 900px) { .pair { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem 1.1rem; min-width: 0; display: flex; flex-direction: column; gap: .8rem; }
.card header { display: flex; align-items: center; gap: .6rem; }
.tag { font: 700 1rem/1 var(--font-display); width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; color: var(--surface); }
.card.A .tag { background: var(--a); } .card.B .tag { background: var(--b); }
.card.A { border-top: 4px solid var(--a); } .card.B { border-top: 4px solid var(--b); }
.label { font: 600 .72rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: .3rem; }
.summary { font-weight: 600; font-size: 1.05rem; }
.md { overflow-wrap: anywhere; }
.md p + p, .md ul, .md ol, .md pre { margin-top: .5rem; }
.md ul, .md ol { padding-left: 1.2rem; margin-bottom: 0; }
.md code { font-family: var(--font-mono); font-size: .85em; background: var(--code); padding: .05em .3em; border-radius: 3px; }
.md pre { background: var(--code); padding: .7rem .8rem; border-radius: 6px; overflow-x: auto; }
.md pre code { background: none; padding: 0; font-size: .82rem; }
.md h2, .md h3 { font: 600 1rem/1.3 var(--font-body); margin: .8rem 0 .2rem; }
details summary { cursor: pointer; font-weight: 600; color: var(--muted); }
details[open] summary { margin-bottom: .5rem; }
.choose { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; position: sticky; bottom: 0; padding-block: .75rem; background: var(--bg); }
.choose button.A { background: var(--a); color: #fff; } .choose button.B { background: var(--b); color: #fff; }

/* Result + totals */
.verdict { font-family: var(--font-display); font-size: clamp(1.8rem, 6vw, 2.8rem); line-height: 1.1; }
.who-anthropic { color: var(--anthropic); } .who-openai { color: var(--openai); }
.recap { display: flex; flex-direction: column; gap: .6rem; }
.recap div { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: .75rem .9rem; display: grid; gap: .2rem; }
.recap b { font-weight: 600; }
.bar { display: flex; height: 2.2rem; border-radius: 6px; overflow: hidden; background: var(--line); font: 600 .85rem/2.2rem var(--font-mono); }
.bar span { color: #fff; padding: 0 .6rem; white-space: nowrap; min-width: 0; overflow: hidden; }
.bar .an { background: var(--anthropic); } .bar .oa { background: var(--openai); text-align: right; }
.legend { display: flex; justify-content: space-between; font-size: .9rem; }
.legend .an { color: var(--anthropic); font-weight: 600; } .legend .oa { color: var(--openai); font-weight: 600; }
.totals { display: flex; flex-direction: column; gap: 1.2rem; }
.tot-row { display: flex; flex-direction: column; gap: .35rem; }
.num { font-variant-numeric: tabular-nums; }
.note { font-size: .85rem; color: var(--muted); max-width: 42rem; }
@media (prefers-reduced-motion: no-preference) { .view { animation: in .25s ease-out; } @keyframes in { from { opacity: .4; transform: translateY(6px); } } }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<noscript><p>This page needs JavaScript.</p></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="data.js"></script>
<script>
// Vote API: the Apps Script /exec URL (can be overridden with ?api=... for testing).
const API = new URLSearchParams(location.search).get('api') || 'https://script.google.com/macros/s/AKfycbxjVhvAZqANp4C-NsnGj41urfzppFtpi9y1641I1FZz3uAAd0sBIVSkRIyRJoWx_afwbQ/exec';
const NAMES = { anthropic: 'Anthropic', openai: 'OpenAI' };
const app = document.getElementById('app');
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('ato-vote-' + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('ato-vote-' + k, JSON.stringify(v)); } catch (e) {} },
};
const md = (s) => DOMPurify.sanitize(marked.parse(s || '', { breaks: false }));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

let state = store.get('state');
function fresh() {
  const order = shuffle(Object.keys(window.ROUNDS));
  return { session: newId(), rounds: order.map((sc) => ({ sc, left: Math.random() < .5 ? 'anthropic' : 'openai', pick: null })), at: 0 };
}

function send(vote) {
  if (!API.startsWith('https://')) return;
  fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(vote) })
    .catch(() => setTimeout(() => send(vote), 4000));
}

function render(view) {
  app.innerHTML = '';
  const v = document.createElement('section');
  v.className = 'view stack';
  v.innerHTML = view;
  app.appendChild(v);
  window.scrollTo(0, 0);
}

function intro() {
  const n = Object.keys(window.ROUNDS).length;
  render(`
    <div class="intro stack">
      <p class="eyebrow">All Things Open 2026 · Percona booth</p>
      <h1>Which AI found it?</h1>
      <p class="lede">We broke a small online shop running on the four Raspberry Pis at our booth. Coroot investigated every outage and asked an AI to explain the root cause, once with each of two AI models.</p>
      <p class="lede">You'll see both explanations side by side, without names. Pick the one you'd rather get when you're on call. After ${n} incidents we'll show you which model you preferred.</p>
      <p class="pi">Real incidents, real diagnoses: MySQL and PostgreSQL on Kubernetes (k3s), managed by OpenEverest, watched by Coroot.</p>
      <div class="row"><button id="go">Start</button><button class="secondary" id="res">See results so far</button></div>
    </div>`);
  document.getElementById('go').onclick = () => { state = fresh(); store.set('state', state); round(); };
  document.getElementById('res').onclick = results;
}

function card(side, p, sc) {
  const a = window.ROUNDS[sc].answers[p];
  return `
    <article class="card ${side}" aria-label="Diagnosis ${side}">
      <header><span class="tag">${side}</span><h2>Diagnosis ${side}</h2></header>
      <div><p class="label">Summary</p><div class="summary md">${md(a.summary)}</div></div>
      <div><p class="label">Root cause</p><div class="md">${md(a.root_cause)}</div></div>
      <div><p class="label">Proposed fix</p><div class="md">${md(a.fixes)}</div></div>
      <details><summary>Full analysis</summary><div class="md">${md(a.details)}</div></details>
    </article>`;
}

function round() {
  const r = state.rounds[state.at], R = window.ROUNDS[r.sc];
  const right = r.left === 'anthropic' ? 'openai' : 'anthropic';
  const bars = state.rounds.map((_, i) => `<span class="${i < state.at ? 'done' : i === state.at ? 'now' : ''}"></span>`).join('');
  render(`
    <p class="eyebrow">Incident ${state.at + 1} of ${state.rounds.length}</p>
    <div class="progress" aria-hidden="true">${bars}</div>
    <div class="symptom"><strong>What users noticed</strong>${esc(R.symptom)}</div>
    <div class="pair">${card('A', r.left, r.sc)}${card('B', right, r.sc)}</div>
    <div class="choose"><button class="A" id="pa">A is better</button><button class="B" id="pb">B is better</button></div>`);
  const pick = (p) => {
    r.pick = p;
    send({ session: state.session, scenario: r.sc, choice: p, left: r.left });
    state.at++;
    store.set('state', state);
    state.at < state.rounds.length ? round() : done();
  };
  document.getElementById('pa').onclick = () => pick(r.left);
  document.getElementById('pb').onclick = () => pick(right);
}

function done() {
  const c = { anthropic: 0, openai: 0 };
  state.rounds.forEach((r) => { if (r.pick) c[r.pick]++; });
  const total = c.anthropic + c.openai;
  const fav = c.anthropic === c.openai ? null : (c.anthropic > c.openai ? 'anthropic' : 'openai');
  const verdict = fav
    ? `You preferred <span class="who-${fav}">${NAMES[fav]}</span> in ${c[fav]} of ${total} incidents.`
    : `A tie: ${c.anthropic} for Anthropic, ${c.openai} for OpenAI.`;
  const recap = state.rounds.map((r, i) => `
    <div><span class="eyebrow">Incident ${i + 1}</span>
      <span>${esc(window.ROUNDS[r.sc].symptom)}</span>
      <span class="muted">What actually happened: ${esc(window.ROUNDS[r.sc].truth)}</span>
      <span>You picked <b class="who-${r.pick}">${NAMES[r.pick] || 'nothing'}</b>.</span></div>`).join('');
  render(`
    <p class="eyebrow">Your result</p>
    <p class="verdict">${verdict}</p>
    <p class="muted">Both explanations of every incident came from Coroot, each written by a different model. Coroot gathers the same evidence for both; only the model writing the diagnosis differs.</p>
    <div class="row"><button id="res">See what everyone picked</button><button class="secondary" id="again">Start over</button></div>
    <div class="recap">${recap}</div>`);
  document.getElementById('res').onclick = results;
  document.getElementById('again').onclick = () => { state = fresh(); store.set('state', state); round(); };
}

function bar(t) {
  const n = t.anthropic + t.openai;
  if (!n) return `<div class="bar"><span class="muted" style="color:var(--muted)">No votes yet</span></div>`;
  const pa = Math.round(t.anthropic / n * 100);
  return `<div class="bar" role="img" aria-label="Anthropic ${t.anthropic}, OpenAI ${t.openai}">
      <span class="an" style="width:${pa}%">${pa ? pa + '%' : ''}</span><span class="oa" style="width:${100 - pa}%">${100 - pa ? (100 - pa) + '%' : ''}</span></div>
    <div class="legend num"><span class="an">Anthropic ${t.anthropic}</span><span class="oa">${t.openai} OpenAI</span></div>`;
}

async function results() {
  render(`<p class="eyebrow">Everyone at the booth</p><h2>What people preferred so far</h2><p class="muted" id="status">Loading the latest votes…</p><div class="totals" id="totals"></div>
    <div class="row"><button id="back">${state && state.at >= state.rounds.length ? 'Back to my result' : 'Vote'}</button><button class="secondary" id="refresh">Refresh</button></div>
    <p class="note">Votes are anonymous: we store only your picks with a random ID, no name, account or device details.</p>`);
  document.getElementById('back').onclick = () => (state && state.at >= state.rounds.length ? done() : intro());
  document.getElementById('refresh').onclick = results;
  const status = document.getElementById('status'), box = document.getElementById('totals');
  try {
    const t = await (await fetch(API, { credentials: 'omit' })).json();
    status.textContent = `${t.people} ${t.people === 1 ? 'person has' : 'people have'} voted (${t.votes} votes).`;
    const rows = Object.keys(window.ROUNDS).map((sc) => `
      <div class="tot-row"><span>${esc(window.ROUNDS[sc].symptom)}</span>${bar(t.scenarios[sc] || { anthropic: 0, openai: 0 })}</div>`).join('');
    box.innerHTML = `<div class="tot-row"><b>All incidents</b>${bar(t.overall)}</div>${rows}`;
  } catch (e) {
    status.textContent = 'Could not load the results right now. Check your connection and tap Refresh.';
  }
}

const hash = location.hash.replace('#', '');
if (hash === 'results') results();
else if (state && state.rounds && state.rounds.every((r) => window.ROUNDS[r.sc]) && state.at > 0)
  state.at >= state.rounds.length ? done() : round();
else intro();
</script>
</body>
</html>
